/* ─────────────────────────────────────────────────────────────
   ORIGINAL CSS — UNCHANGED

:root {
  --bg: #080c0e;
  --bg2: #0d1417;
  --bg3: #111820;
  --teal: #00e5c8;
  --teal-dim: #00a896;

  --font-mono: 'Share Tech Mono', monospace;
  --font-ui: 'Rajdhani', sans-serif;
  --font-code: 'Space Mono', monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-ui);
  font-size: 17px;
  line-height: 1.7;
  overflow-x: hidden;
}

/* SCANLINES */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: multiply;
}

/* PAGE SYSTEM */
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

}
  .nav-logo {

  .nav-logo-mark::before {
    content: '';

    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot {

  .nav-links {

    line-height: 1.7;
  }

  /* ─── TIMELINE ─────────────────────────────────────────────── */
  .timeline {
    margin-top: 2rem;
    padding-left: 1.5rem;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }
  .tl-item { position: relative; }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -1.7rem;
    top: 0.4rem;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }
  .tl-year {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--teal);
    letter-spacing: 0.2em;
    margin-bottom: 0.3rem;
  }
  .tl-title {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .tl-desc {
    font-size: 0.88rem;
    color: rgba(232,240,242,0.5);
    font-weight: 300;
  }

  /* ─── FOOTER ───────────────────────────────────────────────── */
  footer {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 3rem 5rem;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 2rem;
  }
  .footer-left { }
  .footer-brand {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--teal);
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }
  .footer-copy {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .footer-right {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    letter-spacing: 0.1em;
    line-height: 1.8;
  }

  /* ─── TERMINAL BLOCK ───────────────────────────────────────── */
  .terminal {
    background: #040708;
    border: 1px solid var(--border);
    padding: 1.5rem 2rem;
    font-family: var(--font-code);
    font-size: 0.78rem;
    line-height: 1.8;
    color: rgba(232,240,242,0.55);
    margin-top: 2rem;
    position: relative;
  }
  .terminal::before {
    content: 'OMEGA SYSTEM STATUS';
    position: absolute;
    top: -0.6rem;
    left: 1rem;
    background: #040708;
    padding: 0 0.5rem;
    font-size: 0.6rem;
    color: var(--teal);
    letter-spacing: 0.2em;
  }
  .terminal .t-green { color: #4ade80; }
  .terminal .t-teal { color: var(--teal); }
  .terminal .t-amber { color: var(--amber); }
  .terminal .t-muted { color: var(--muted); }
  .cursor { display: inline-block; width: 8px; height: 1em; background: var(--teal); animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 2px; }

  /* ─── PAGE HERO SHARED ─────────────────────────────────────── */
  .page-hero-strip {
    padding: 8rem 5rem 4rem;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .page-hero-strip::after {
    content: '';
    position: absolute;
    bottom: 0; left: 5rem; right: 5rem;
    height: 1px;
    background: linear-gradient(90deg, var(--teal), transparent);
  }

  /* ─── RESPONSIVE TWEAKS ────────────────────────────────────── */
  @media (max-width: 900px) {
    nav { padding: 0 1.5rem; gap: 1rem; }
    .nav-status { display: none; }
    section { padding: 4rem 1.5rem; }
    .hero { grid-template-columns: 1fr; }
    .hero-right { display: none; }
    .hero-left { padding: 5rem 1.5rem 4rem; }
    footer { grid-template-columns: 1fr; }
    .footer-right { text-align: left; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .feature-grid { grid-template-columns: 1fr; }
    .challenge-layout { grid-template-columns: 1fr; }
    .omega-perf-grid { grid-template-columns: 1fr; }
    .team-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .about-hero, .page-hero-strip { padding: 8rem 1.5rem 3rem; }
    .omega-hero-content { padding: 4rem 1.5rem; }
  }
